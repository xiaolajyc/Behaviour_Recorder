<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>个人行为记录</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#202124;--muted:#70757a;--line:#e5e7eb;--accent:#2563eb;--good:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}
.app{max-width:900px;margin:auto;min-height:100vh;padding-bottom:78px}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);padding:16px;border-bottom:1px solid var(--line)}
h1,h2,h3,p{margin:0}.header-row{display:flex;align-items:center;justify-content:space-between}.sub{color:var(--muted);font-size:13px;margin-top:4px}
main{padding:16px}.section{margin-bottom:20px}.section-title{font-size:18px;font-weight:700;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.behavior{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;min-height:120px;position:relative}
.behavior .icon{font-size:28px}.behavior .name{font-weight:700;margin-top:7px}.progress{height:7px;background:#eef0f2;border-radius:99px;margin:9px 0 5px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}.small{font-size:12px;color:var(--muted)}.record{border-left:4px solid var(--c)}.thumb-row{display:flex;gap:7px;overflow:auto;margin-top:10px}.thumb{width:76px;height:76px;object-fit:cover;border-radius:9px}.filterbar{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.filter{white-space:nowrap;border-radius:999px;padding:8px 12px;background:#eef0f2}.filter.active{background:#111827;color:white}.chart{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;overflow:hidden}.chart svg{width:100%;height:220px;display:block}.hero{border-radius:18px;padding:18px;color:#fff;margin-bottom:14px}.hero .big{font-size:32px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.pill{padding:5px 9px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px}.good{color:var(--good)}.warn{color:var(--warn)}
.btn{padding:10px 13px;border-radius:12px;background:#eef0f2}.primary{background:var(--accent);color:#fff}.danger{background:#fee2e2;color:#b91c1c}.iconbtn{width:40px;height:40px;border-radius:12px;background:#f1f3f4}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;justify-content:center}
.nav-inner{width:min(900px,100%);display:grid;grid-template-columns:repeat(5,1fr)}.nav button{background:none;padding:10px 4px;color:var(--muted);font-size:12px}.nav button.active{color:var(--accent);font-weight:700}.nav .ni{display:block;font-size:20px}
.calendar{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}.cal-head div{text-align:center;padding:9px;color:var(--muted);font-size:12px}.day{min-height:66px;border-top:1px solid var(--line);border-right:1px solid var(--line);padding:5px;font-size:12px}.day:nth-child(7n){border-right:0}.day.today{background:#eff6ff}.dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;font-size:25px;margin-top:5px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px;max-width:700px;margin:auto}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #d8dce1;border-radius:10px;background:#fff}textarea{min-height:80px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;margin-top:16px}.actions>*{flex:1}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo-box{border:1px dashed #c8ccd1;border-radius:12px;min-height:130px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fafafa}.photo-box img{width:100%;height:160px;object-fit:cover}
.empty{text-align:center;padding:30px;color:var(--muted)}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}main{padding:22px}.modal{align-items:center}.sheet{border-radius:20px}}

/* v6: photo comparison */
.photo-compare{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);gap:8px;align-items:center;margin-top:10px}
.compare-photo{position:relative;border-radius:14px;overflow:hidden;background:#f2f3f5;border:2px solid #d9dce1;min-height:130px}
.compare-photo.before-photo{border-color:#9aa0a6}
.compare-photo.after-photo{border-color:#2563eb}
.compare-photo img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;cursor:pointer}
.photo-label{position:absolute;z-index:2;left:8px;top:8px;padding:4px 8px;border-radius:999px;background:rgba(0,0,0,.62);color:#fff;font-size:12px;font-weight:700}
.after-photo .photo-label{background:rgba(37,99,235,.9)}
.compare-arrow{font-size:24px;font-weight:800;text-align:center;color:#6b7280}
.compare-title{margin-top:12px;font-weight:800;font-size:14px}
.no-photo{height:130px;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:13px}
.behavior-link{border:0;background:none;padding:0;font:inherit;font-weight:800;cursor:pointer;text-align:left}

/* v6: calendar behavior-colored dots */
.calendar-dot-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.calendar-behavior-dot{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px rgba(0,0,0,.08)}

</style>
</head>
<body>
<div class="app">
<header><div class="header-row"><div><h1 id="title">今日</h1><div class="sub" id="subtitle"></div></div><div class="row"><button class="iconbtn" onclick="page('settings')">⚙️</button><button class="iconbtn" onclick="openRecord()">＋</button></div></div></header>
<main id="main"></main>
</div>
<nav class="nav"><div class="nav-inner">
<button data-page="today" onclick="page('today')"><span class="ni">☀️</span>今日</button>
<button data-page="history" onclick="page('history')"><span class="ni">📜</span>历史</button>
<button data-page="calendar" onclick="page('calendar')"><span class="ni">🗓️</span>日历</button>
<button data-page="stats" onclick="page('stats')"><span class="ni">📊</span>统计</button>
<button data-page="behaviors" onclick="page('behaviors')"><span class="ni">⚙️</span>行为</button>
</div></nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<input id="photoInput" type="file" accept="image/*" hidden>
<script>
const APP_VERSION='v6.0.0';
const IDB_NAME='personal_behavior_tracker_v5';
const DB_VERSION=1;
let db={behaviors:[],records:[],settings:{version:APP_VERSION}};
let photoCache=new Map();
const COLORS=['#2563eb','#16a34a','#dc2626','#9333ea','#ea580c','#0891b2','#db2777','#65a30d','#7c3aed','#ca8a04'];
let calYear=new Date().getFullYear(), calMonth=new Date().getMonth();
let currentPage='today', selectedBehavior=null, photoTarget=null, historyFilter='all';

function openIDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=()=>{
      const d=req.result;
      if(!d.objectStoreNames.contains('behaviors'))d.createObjectStore('behaviors',{keyPath:'id'});
      if(!d.objectStoreNames.contains('records'))d.createObjectStore('records',{keyPath:'id'});
      if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id'});
      if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'});
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('IndexedDB unavailable'));
  });
}
function txReadAll(storeName){
  return openIDB().then(d=>new Promise((resolve,reject)=>{
    const tx=d.transaction(storeName,'readonly');
    const req=tx.objectStore(storeName).getAll();
    req.onsuccess=()=>resolve(req.result||[]);
    req.onerror=()=>reject(req.error||new Error('读取数据库失败'));
  }));
}
function txRead(storeName,key){
  return openIDB().then(d=>new Promise((resolve,reject)=>{
    const req=d.transaction(storeName,'readonly').objectStore(storeName).get(key);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error||new Error('读取数据库失败'));
  }));
}
function txPutAll(storeName,items){
  return openIDB().then(d=>new Promise((resolve,reject)=>{
    const tx=d.transaction(storeName,'readwrite'),s=tx.objectStore(storeName);
    for(const item of items)s.put(item);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error||new Error('数据库写入失败'));
    tx.onabort=()=>reject(tx.error||new Error('数据库写入被中止'));
  }));
}
function txDeleteAll(storeName){
  return openIDB().then(d=>new Promise((resolve,reject)=>{
    const tx=d.transaction(storeName,'readwrite');
    tx.objectStore(storeName).clear();
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error||new Error('数据库清理失败'));
    tx.onabort=()=>reject(tx.error||new Error('数据库清理被中止'));
  }));
}

const META_KEY='personal_behavior_tracker_metadata_v5';
function localSnapshot(){
  return {behaviors:db.behaviors||[],records:(db.records||[]).map(r=>{
    const x={...r};
    // Photos are stored in IndexedDB; keep only their IDs in the durable metadata fallback.
    if(typeof x.before==='string'&&x.before.startsWith('data:'))delete x.before;
    if(typeof x.after==='string'&&x.after.startsWith('data:'))delete x.after;
    return x;
  }),settings:{...(db.settings||{}),version:APP_VERSION}};
}
function writeLocalFallback(){
  try{
    localStorage.setItem(META_KEY,JSON.stringify(localSnapshot()));
    return true;
  }catch(e){
    console.warn('localStorage fallback failed',e);
    return false;
  }
}
function readLocalFallback(){
  try{
    const raw=localStorage.getItem(META_KEY);
    if(!raw)return null;
    const x=JSON.parse(raw);
    return x&&Array.isArray(x.behaviors)&&Array.isArray(x.records)?x:null;
  }catch(e){return null}
}
function mergeById(a,b){
  const m=new Map((a||[]).map(x=>[x.id,x]));
  for(const x of (b||[]))m.set(x.id,x);
  return [...m.values()];
}
function dataURLToBlob(dataURL){
  if(!dataURL||typeof dataURL!=='string')return null;
  try{
    const parts=dataURL.split(',');
    const mime=(parts[0].match(/:(.*?);/)||[])[1]||'image/jpeg';
    const bin=atob(parts[1]);
    const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    return new Blob([arr],{type:mime});
  }catch(e){return null}
}
async function savePhoto(id,value){
  if(!value)return;
  let blob=null;
  if(typeof value==='string'&&value.startsWith('data:'))blob=dataURLToBlob(value);
  else if(value instanceof Blob)blob=value;
  else if(typeof value==='string'&&photoCache.has(value)){
    try{blob=await fetch(photoCache.get(value)).then(r=>r.blob())}catch(e){}
  }
  if(!blob)return;
  await txPutAll('photos',[{id,blob}]);
}
async function loadPhotoStore(){
  photoCache.forEach(url=>URL.revokeObjectURL(url));
  photoCache.clear();
  try{
    const photos=await txReadAll('photos');
    for(const p of photos)if(p.blob)photoCache.set(p.id,URL.createObjectURL(p.blob));
  }catch(e){console.warn('照片读取失败',e)}
}
async function normalizeRecords(){
  for(const r of db.records){
    for(const side of ['before','after']){
      const value=r[side];
      if(typeof value==='string'&&value.startsWith('data:')){
        const id=r.id+':'+side;
        await savePhoto(id,value);
        r[side]=id;
      }
    }
  }
}
async function initStorage(){
  // First load the small local fallback so a refresh never starts from an empty UI
  // if IndexedDB is temporarily unavailable.
  const fallback=readLocalFallback();
  if(fallback){
    db={behaviors:fallback.behaviors||[],records:fallback.records||[],settings:{...(fallback.settings||{}),version:APP_VERSION}};
  }
  try{
    const [ib,ir,meta]=await Promise.all([
      txReadAll('behaviors'),
      txReadAll('records'),
      txRead('meta','settings')
    ]);
    const indexed={behaviors:ib||[],records:ir||[],settings:meta?.value||{}};

    // Prefer the union of local fallback and IndexedDB. This protects against
    // a partially completed write or Safari restoring one storage layer first.
    db.behaviors=mergeById(indexed.behaviors,db.behaviors);
    db.records=mergeById(indexed.records,db.records);
    db.settings={...indexed.settings,...(db.settings||{}),version:APP_VERSION};

    await normalizeRecords();

    // Persist the merged state to both stores.
    await txPutAll('behaviors',db.behaviors);
    await txPutAll('records',db.records);
    await txPutAll('meta',[{key:'settings',value:db.settings}]);
    writeLocalFallback();
    await loadPhotoStore();
  }catch(e){
    console.warn('IndexedDB unavailable, using local fallback',e);
    if(!fallback){
      db={behaviors:[],records:[],settings:{version:APP_VERSION}};
      writeLocalFallback();
    }
  }
}
async function save(){
  // Write the small fallback FIRST. Therefore even if IndexedDB fails,
  // behavior names and record metadata survive a refresh.
  writeLocalFallback();

  await normalizeRecords();

  await txPutAll('behaviors',db.behaviors);
  await txPutAll('records',db.records);
  db.settings={...(db.settings||{}),version:APP_VERSION};
  await txPutAll('meta',[{key:'settings',value:db.settings}]);
  writeLocalFallback();
  await loadPhotoStore();
}

function photoSrc(value){
  if(!value)return '';
  if(typeof value==='string'&&value.startsWith('data:'))return value;
  return photoCache.get(value)||'';
}

function formatDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function isoDate(d=new Date()){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function daysAgo(n){let d=new Date();d.setDate(d.getDate()-n);return isoDate(d)}
function activeBehaviors(){return db.behaviors.filter(b=>!b.archived)}
function color(b){let i=db.behaviors.findIndex(x=>x.id===b.id);return b.color||COLORS[(i<0?0:i)%COLORS.length]}
function freqText(b){if(!b.hasTarget)return '不设频率目标';return b.freqType==='day'?`每天 ${b.target} 次`:b.freqType==='week'?`每周 ${b.target} 次`:b.freqType==='month'?`每月 ${b.target} 次`:`每 ${b.period} 天 ${b.target} 次`}
function periodStart(b,date=new Date()){let d=new Date(date);d.setHours(0,0,0,0);if(!b.hasTarget)return isoDate(d);if(b.freqType==='day')return isoDate(d);if(b.freqType==='week'){let x=d.getDay();d.setDate(d.getDate()-((x+6)%7));return isoDate(d)}if(b.freqType==='month'){d.setDate(1);return isoDate(d)}d.setDate(d.getDate()-((b.period||7)-1));return isoDate(d)}
function countFor(b,end=new Date()){if(!b.hasTarget)return db.records.filter(r=>r.behaviorId===b.id).length;let s=periodStart(b,end),e=isoDate(end);return db.records.filter(r=>r.behaviorId===b.id&&r.date>=s&&r.date<=e).length}
function renderHeader(){let titles={today:'今日',history:'历史记录',calendar:'日历',stats:'统计',behaviors:'行为',settings:'设置'};document.getElementById('title').textContent=titles[currentPage];document.getElementById('subtitle').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===currentPage))}
function page(p){
  const allowed=['today','history','calendar','stats','behaviors','settings'];
  if(!allowed.includes(p))p='today';
  currentPage=p;
  render();
  try{window.history.replaceState(null,'','#'+p)}catch(e){}
}
function render(){
  renderHeader();
  const m=document.getElementById('main');
  if(currentPage==='today')m.innerHTML=today();
  else if(currentPage==='history')m.innerHTML=historyPage();
  else if(currentPage==='calendar')m.innerHTML=calendar();
  else if(currentPage==='stats')m.innerHTML=stats();
  else if(currentPage==='behaviors')m.innerHTML=behaviors();
  else if(currentPage==='settings')m.innerHTML=settingsPage();
}
function behaviorCard(b){let c=countFor(b),t=+b.target||1,p=b.hasTarget?Math.min(100,c/t*100):0;return `<button class="behavior" style="--c:${color(b)}" onclick="openRecord('${b.id}')"><div class="icon">${esc(b.icon||'✓')}</div><div class="name">${esc(b.name)}</div><div class="small">${freqText(b)}</div>${b.hasTarget?`<div class="progress"><i style="width:${p}%;background:${color(b)}"></i></div><div class="small">${c>=t?'✓ 已达标':`已完成 ${c} / ${t}`}</div>`:`<div class="small" style="margin-top:14px">累计记录 ${c} 次</div>`}</button>`}
function today(){let bs=activeBehaviors();if(!bs.length)return `<div class="empty">还没有行为。<br><br><button class="btn primary" onclick="openBehavior()">＋ 添加第一个行为</button></div>`;let cards=bs.map(behaviorCard).join('');let recent=db.records.slice().sort((a,b)=>b.timestamp-a.timestamp).slice(0,8).map(recordHtml).join('');return `<div class="section"><div class="section-title">快速记录</div><div class="grid">${cards}</div></div><div class="section"><div class="section-title">最近记录</div>${recent||'<div class="empty">暂无记录</div>'}</div>`}
function recordHtml(r){
  const b=db.behaviors.find(x=>x.id===r.behaviorId);
  if(!b)return '';
  const before=r.before?photoSrc(r.before):'';
  const after=r.after?photoSrc(r.after):'';
  return `<div class="record card" data-date="${esc(r.date)}" style="border-left:4px solid ${b.color||'#2563eb'}">
    <div class="row between">
      <button class="behavior-link" onclick="openBehaviorDetail('${b.id}')" style="color:${b.color||'#2563eb'}">${esc(b.icon||'✓')} ${esc(b.name)}</button>
      <button class="iconbtn" onclick="deleteRecord('${r.id}')" aria-label="删除">🗑️</button>
    </div>
    <div class="small">${esc(r.date)} ${r.time?esc(r.time):''}</div>
    ${r.note?`<div class="note">${esc(r.note)}</div>`:''}
    ${(before||after)?`
      <div class="compare-title">前后对比</div>
      <div class="photo-compare">
        <div class="compare-photo before-photo">
          <div class="photo-label">之前</div>
          ${before?`<img src="${before}" onclick="viewPhoto('${r.before}')" alt="之前">`:'<div class="no-photo">未添加</div>'}
        </div>
        <div class="compare-arrow">→</div>
        <div class="compare-photo after-photo">
          <div class="photo-label">之后</div>
          ${after?`<img src="${after}" onclick="viewPhoto('${r.after}')" alt="之后">`:'<div class="no-photo">未添加</div>'}
        </div>
      </div>`:''}
  </div>`;
}
function historyPage(){
  const bs=activeBehaviors();
  const rs=db.records.slice().sort((a,b)=>b.timestamp-a.timestamp);
  const filtered=historyFilter==='all'?rs:rs.filter(r=>r.behaviorId===historyFilter);
  return `<div class="card"><div class="row between"><div><b>历史记录</b><div class="small" style="margin-top:4px">按行为筛选，点击行为可进入详情</div></div><button class="btn primary" onclick="openRecord()">＋ 新建</button></div></div>
  <div class="filterbar"><button class="filter ${historyFilter==='all'?'active':''}" onclick="setHistoryFilter('all')">全部</button>${bs.map(b=>`<button class="filter ${historyFilter===b.id?'active':''}" onclick="setHistoryFilter('${b.id}')">${esc(b.icon||'✓')} ${esc(b.name)}</button>`).join('')}</div>
  ${filtered.length?filtered.map(recordHtml).join(''):'<div class="empty">没有历史记录</div>'}`;
}
function setHistoryFilter(id){historyFilter=id;render()}

function calendar(){
  const now=new Date();
  const y=calYear??now.getFullYear();
  const mo=calMonth??now.getMonth();
  const first=new Date(y,mo,1);
  const last=new Date(y,mo+1,0);
  const start=(first.getDay()+6)%7;
  const days=[];
  for(let i=0;i<start;i++)days.push('<div class="cal-day empty"></div>');
  for(let d=1;d<=last.getDate();d++){
    const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const recs=db.records.filter(r=>r.date===ds);
    const dots=[];
    const seen=new Set();
    for(const r of recs){
      if(seen.has(r.behaviorId))continue;
      const b=db.behaviors.find(x=>x.id===r.behaviorId);
      if(!b)continue;
      seen.add(r.behaviorId);
      dots.push(`<span class="calendar-behavior-dot" style="background:${b.color||'#2563eb'}" title="${esc(b.name)}"></span>`);
    }
    const isToday=ds===formatDate(new Date());
    days.push(`<div class="cal-day ${isToday?'today':''}" onclick="openDay('${ds}')">
      <div class="cal-num">${d}</div>
      ${dots.length?`<div class="calendar-dot-row">${dots.join('')}</div>`:''}
    </div>`);
  }
  return `<div class="card calendar-head">
    <button class="iconbtn" onclick="changeMonth(-1)">‹</button>
    <b>${y}年${mo+1}月</b>
    <button class="iconbtn" onclick="changeMonth(1)">›</button>
  </div>
  <div class="calendar-week">${['一','二','三','四','五','六','日'].map(x=>`<div>${x}</div>`).join('')}</div>
  <div class="calendar-grid">${days.join('')}</div>`;
}
function changeMonth(n){calOffset+=n;let base=new Date();base.setMonth(base.getMonth()+calOffset);document.getElementById('main').innerHTML=calendarAt(base)}
function calendarAt(now){let y=now.getFullYear(),mo=now.getMonth(),first=new Date(y,mo,1),last=new Date(y,mo+1,0),offset=(first.getDay()+6)%7,c='';for(let i=0;i<offset;i++)c+='<div class="day"></div>';for(let d=1;d<=last.getDate();d++){let date=isoDate(new Date(y,mo,d)),rs=db.records.filter(r=>r.date===date);c+=`<div class="day ${date===isoDate(new Date())?'today':''}" onclick="dayDetail('${date}')"><b>${d}</b><div class="dots">${rs.slice(0,12).map(()=>'<i class="dot"></i>').join('')}</div></div>`}return `<div class="row between" style="margin-bottom:12px"><button class="btn" onclick="changeMonth(-1)">‹</button><b>${y}年 ${mo+1}月</b><button class="btn" onclick="changeMonth(1)">›</button></div><div class="calendar"><div class="cal-head">${['一','二','三','四','五','六','日'].map(x=>`<div>${x}</div>`).join('')}</div><div class="cal-grid">${c}</div></div>`}
function dayDetail(date){let rs=db.records.filter(r=>r.date===date).sort((a,b)=>b.timestamp-a.timestamp);openModal(`<h2>${date}</h2><div style="margin-top:12px">${rs.length?rs.map(r=>{let b=db.behaviors.find(x=>x.id===r.behaviorId);return `<div class="card"><div class="row between"><b>${b?esc(b.icon)+' '+esc(b.name):'已删除行为'}</b><span class="small">${new Date(r.timestamp).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</span></div>${r.note?`<p class="small" style="margin-top:7px">${esc(r.note)}</p>`:''}${r.before||r.after?`<div class="photo-grid" style="margin-top:10px">${photoSrc(r.before)?`<div><div class="small">之前</div><img src="${photoSrc(r.before)}" style="width:100%;border-radius:10px"></div>`:''}${photoSrc(r.after)?`<div><div class="small">之后</div><img src="${photoSrc(r.after)}" style="width:100%;border-radius:10px"></div>`:''}</div>`:''}</div>`}).join(''):'<div class="empty">当天没有记录</div>'}</div><div class="actions"><button class="btn" onclick="closeModal()">关闭</button></div>`)}
function monthKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function monthLabel(d){return `${d.getMonth()+1}月`}
function countBehaviorMonth(id,d){const k=monthKey(d);return db.records.filter(r=>r.behaviorId===id&&r.date.startsWith(k)).length}
function countBehaviorYear(id,y){return db.records.filter(r=>r.behaviorId===id&&r.date.startsWith(String(y))).length}
function monthlyChart(b){
 const now=new Date(),pts=[];for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);pts.push([monthLabel(d),countBehaviorMonth(b.id,d)])}
 const max=Math.max(1,...pts.map(x=>x[1])),w=620,h=220,pad=32;
 const line=pts.map((x,i)=>`${pad+i*(w-2*pad)/(pts.length-1)},${h-pad-(x[1]/max)*(h-2*pad)}`).join(' ');
 return `<div class="chart"><div class="row between"><b>月度记录趋势</b><span class="small">最近12个月</span></div><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#ddd"/><polyline fill="none" stroke="${color(b)}" stroke-width="3" points="${line}"/>${pts.map((x,i)=>{let xx=pad+i*(w-2*pad)/(pts.length-1),yy=h-pad-(x[1]/max)*(h-2*pad);return `<circle cx="${xx}" cy="${yy}" r="4" fill="${color(b)}"><title>${x[0]}：${x[1]}次</title></circle><text x="${xx}" y="${h-7}" text-anchor="middle" font-size="10" fill="#73777d">${x[0]}</text>`}).join('')}</svg><div class="small">按月份比较记录次数</div></div>`
}
function yearlyChart(b){
 const y=new Date().getFullYear(),ys=[y-4,y-3,y-2,y-1,y],vals=ys.map(x=>countBehaviorYear(b.id,x)),max=Math.max(1,...vals),w=620,h=220,pad=36,gap=18,bw=(w-2*pad-gap*(vals.length-1))/vals.length;
 return `<div class="chart" style="margin-top:10px"><div class="row between"><b>年度记录对比</b><span class="small">最近5年</span></div><svg viewBox="0 0 ${w} ${h}">${vals.map((v,i)=>{let x=pad+i*(bw+gap),bh=(v/max)*(h-55),y0=h-32-bh;return `<rect x="${x}" y="${y0}" width="${bw}" height="${bh}" rx="5" fill="${color(b)}" opacity="${i===vals.length-1?1:.55}"><title>${ys[i]}年：${v}次</title></rect><text x="${x+bw/2}" y="${h-13}" text-anchor="middle" font-size="11" fill="#73777d">${ys[i]}</text><text x="${x+bw/2}" y="${Math.max(12,y0-5)}" text-anchor="middle" font-size="11">${v}</text>`}).join('')}</svg><div class="small">当前年度与过去年度并列比较</div></div>`
}
function stats(){
 let bs=activeBehaviors(),total=db.records.length,month=isoDate(new Date()).slice(0,7),mr=db.records.filter(r=>r.date.startsWith(month)).length;
 return `<div class="stats"><div class="stat">总记录<b>${total}</b></div><div class="stat">本月记录<b>${mr}</b></div><div class="stat">行为数量<b>${bs.length}</b></div><div class="stat">有目标行为<b>${bs.filter(b=>b.hasTarget).length}</b></div></div>
 <div style="margin-top:18px">${bs.map(b=>`<div class="card" style="border-left:4px solid ${color(b)}"><div class="row between"><b>${esc(b.icon||'✓')} ${esc(b.name)}</b><button class="btn" onclick="openBehaviorDetail('${b.id}')">详情</button></div><div class="small" style="margin-top:6px">${freqText(b)} · 累计 ${db.records.filter(r=>r.behaviorId===b.id).length} 次</div></div>`).join('')}</div>`
}
function behaviors(){let list=db.behaviors.map(b=>`<div class="card" style="border-left:4px solid ${color(b)};opacity:${b.archived?.55:1}"><div class="row"><span style="font-size:26px">${esc(b.icon||'✓')}</span><div style="flex:1"><b>${esc(b.name)}</b><div class="small">${freqText(b)} · ${b.photo?'可添加照片':'无照片要求'}</div></div><button class="btn" onclick="openBehaviorDetail('${b.id}')">详情</button><button class="btn" onclick="openBehavior('${b.id}')">编辑</button></div></div>`).join('');return `<div class="row between" style="margin-bottom:12px"><div class="section-title" style="margin:0">我的行为</div><div class="row"><button class="btn" onclick="page('settings')">⚙️ 设置</button><button class="btn primary" onclick="openBehavior()">＋ 添加</button></div></div>${list||'<div class="empty">还没有创建行为</div>'}`}
function settingsPage(){
 return `<div class="card"><div class="row between"><div><b>应用信息</b><div class="small" style="margin-top:5px">个人行为记录</div></div><b>${APP_VERSION}</b></div></div>
 <div class="card"><b>数据存储</b><p class="small" style="margin-top:8px">数据保存在本设备浏览器的 IndexedDB 中。照片单独存储，不再占用 localStorage 的小容量配额。</p></div>
 <div class="card"><b>版本信息</b><div class="small" style="margin-top:8px">当前版本：${APP_VERSION}<br>数据结构：IndexedDB v5 + 本地元数据备份<br>更新内容：历史记录、月度趋势、年度对比、照片独立存储、刷新数据持久化。</div></div>`
}
function behaviorDetail(id){
 let b=db.behaviors.find(x=>x.id===id);if(!b)return '';
 let rs=db.records.filter(r=>r.behaviorId===id).sort((a,b)=>b.timestamp-a.timestamp);
 return `<div class="hero" style="background:${color(b)}"><div style="font-size:30px">${esc(b.icon||'✓')}</div><h2>${esc(b.name)}</h2><div style="opacity:.85">${freqText(b)}</div><div class="big">${rs.length}</div><div>累计记录</div></div>
 ${monthlyChart(b)}${yearlyChart(b)}
 <div class="card" style="margin-top:12px"><div class="row between"><b>历史记录</b><span class="small">${rs.length} 次</span></div>${rs.length?rs.map(recordHtml).join(''):'<div class="empty">暂无记录</div>'}</div>`
}
function openBehaviorDetail(id){let b=db.behaviors.find(x=>x.id===id);if(!b)return;openModal(`<div class="row between"><h2>${esc(b.icon||'✓')} ${esc(b.name)}</h2><button class="btn" onclick="closeModal()">关闭</button></div><div style="margin-top:14px">${behaviorDetail(id)}</div>`)}
function openModal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()})

function openBehavior(id){let b=id?db.behaviors.find(x=>x.id===id):null;openModal(`<h2>${b?'编辑行为':'添加行为'}</h2><label>行为名称</label><input id="bn" value="${esc(b?.name||'')}" placeholder="例如：洗衣服"><div class="form-grid"><div><label>图标</label><input id="bi" value="${esc(b?.icon||'✓')}"></div><div><label>颜色</label><input id="bcolor" type="color" value="${b?.color||COLORS[db.behaviors.length%COLORS.length]}" style="height:44px;padding:4px"></div></div><label>是否设置频率目标</label><select id="bhas" onchange="toggleFreq()"><option value="no" ${b&&!b.hasTarget?'selected':''}>不设置目标</option><option value="yes" ${!b||b.hasTarget?'selected':''}>设置目标</option></select><div id="freqArea"><label>频率</label><select id="ft"><option value="day" ${b?.freqType==='day'?'selected':''}>每天</option><option value="week" ${(!b||b.freqType==='week')?'selected':''}>每周</option><option value="month" ${b?.freqType==='month'?'selected':''}>每月</option><option value="custom" ${b?.freqType==='custom'?'selected':''}>每 N 天</option></select><div class="form-grid"><div><label>目标次数</label><input id="bt" type="number" min="1" value="${b?.target||1}"></div><div><label>周期天数</label><input id="bp" type="number" min="1" value="${b?.period||7}"></div></div></div><label><input id="bphoto" type="checkbox" style="width:auto" ${b?.photo?'checked':''}> 允许为记录添加照片</label><div class="actions">${b?`<button class="btn danger" onclick="deleteBehavior('${b.id}')">删除行为</button>`:''}<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveBehavior('${id||''}')">保存</button></div>`);toggleFreq()}
function toggleFreq(){let has=document.getElementById('bhas')?.value==='yes';if(document.getElementById('freqArea'))document.getElementById('freqArea').style.display=has?'block':'none'}
async function saveBehavior(id){try{let name=document.getElementById('bn').value.trim();if(!name){alert('请输入行为名称');return}let b=id?db.behaviors.find(x=>x.id===id):{id:uid(),archived:false};let has=document.getElementById('bhas').value==='yes';Object.assign(b,{name,icon:document.getElementById('bi').value||'✓',color:document.getElementById('bcolor').value,hasTarget:has,photo:document.getElementById('bphoto').checked});if(has){b.freqType=document.getElementById('ft').value;b.target=Math.max(1,+document.getElementById('bt').value||1);b.period=Math.max(1,+document.getElementById('bp').value||7)}else{delete b.freqType;delete b.target;delete b.period}if(!id)db.behaviors.push(b);await save();closeModal();render()}catch(e){alert('保存失败：'+e.message)}}
async function deleteBehavior(id){let b=db.behaviors.find(x=>x.id===id);if(!b)return;if(!confirm(`确定删除“${b.name}”以及它的全部历史记录和照片吗？此操作不可恢复。`))return;db.behaviors=db.behaviors.filter(x=>x.id!==id);db.records=db.records.filter(r=>r.behaviorId!==id);try{await save();closeModal();render()}catch(e){alert('删除失败：'+e.message)}}
function openRecord(id){let bs=activeBehaviors();if(!bs.length){alert('请先添加行为');return}let b=id?db.behaviors.find(x=>x.id===id):bs[0];selectedBehavior=b.id;pendingPhotos={before:null,after:null};openModal(`<h2>新建记录</h2><label>行为</label><select id="recordBehavior" onchange="selectedBehavior=this.value">${bs.map(x=>`<option value="${x.id}" ${x.id===b.id?'selected':''}>${esc(x.icon||'✓')} ${esc(x.name)}</option>`).join('')}</select><label>日期</label><input id="rd" type="date" value="${isoDate()}"><label>时间</label><input id="rt" type="time" value="${new Date().toTimeString().slice(0,5)}"><label>备注</label><textarea id="rn" placeholder="可选"></textarea><label>照片（可选，可从图库选择）</label><div class="photo-grid"><div><div class="small">之前</div><div class="photo-box" id="beforeBox"><button class="btn" onclick="choosePhoto('before')">＋ 从图库选择</button></div></div><div><div class="small">之后</div><div class="photo-box" id="afterBox"><button class="btn" onclick="choosePhoto('after')">＋ 从图库选择</button></div></div></div><div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveRecord()">保存记录</button></div>`)}
function choosePhoto(which){photoTarget=which;document.getElementById('photoInput').value='';document.getElementById('photoInput').click()}
async function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const src=fr.result,img=new Image();
      img.onload=()=>{
        try{
          const max=1600,iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;
          const scale=Math.min(1,max/Math.max(iw,ih));
          const w=Math.max(1,Math.round(iw*scale)),h=Math.max(1,Math.round(ih*scale));
          const c=document.createElement('canvas');c.width=w;c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          resolve(c.toDataURL('image/jpeg',0.82));
        }catch(e){resolve(src)}
      };
      img.onerror=()=>resolve(src);
      img.src=src;
    };
    fr.onerror=()=>reject(fr.error||new Error('读取照片失败'));
    fr.readAsDataURL(file);
  });
}
document.getElementById('photoInput').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const data=await fileToDataURL(f);
    pendingPhotos[photoTarget]=data;
    const box=document.getElementById(photoTarget+'Box');
    if(box)box.innerHTML=`<img src="${data}">`;
  }catch(err){alert('照片读取失败：'+err.message)}
});
async function saveRecord(){
  try{
    const bId=document.getElementById('recordBehavior').value;
    const d=document.getElementById('rd').value;
    const t=document.getElementById('rt').value||'00:00';
    if(!d){alert('请选择日期');return}
    const timestamp=new Date(`${d}T${t}`).getTime();
    if(!Number.isFinite(timestamp))throw new Error('日期或时间无效');
    const id=uid();
    const r={id,behaviorId:bId,date:d,timestamp,note:document.getElementById('rn').value.trim()};
    if(pendingPhotos.before){r.before=id+':before';await savePhoto(r.before,pendingPhotos.before)}
    if(pendingPhotos.after){r.after=id+':after';await savePhoto(r.after,pendingPhotos.after)}
    db.records.push(r);
    await save();
    pendingPhotos={before:null,after:null};
    closeModal();
    render();
  }catch(e){alert('保存记录失败：'+e.message)}
}
window.addEventListener('hashchange',()=>{
  const p=location.hash.slice(1);
  if(['today','history','calendar','stats','behaviors','settings'].includes(p))render();
});
(async()=>{
  await initStorage();
  const p=location.hash.slice(1);
  page(['today','history','calendar','stats','behaviors','settings'].includes(p)?p:'today');
})();
</script>
